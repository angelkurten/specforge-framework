name: cli-ci

# Runs the CLI test suite on every push and PR.
#
# cli-release.yml runs `pnpm test` too, but only on a `v*.*.*` tag — so a
# validator regression could sit on main undetected until release day. This
# workflow closes that window.
#
# `specforge doctor` is deliberately NOT run here yet: the repo does not pass
# its own doctor (example rows in SIBLINGS.md, the self-referential
# prd-marketing-language hits, missing manifest). Add the step once those are
# resolved — a check that is red on day one trains people to ignore CI.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
