name: v2-ci

# Runs the v2 Python suites on every push and PR. cli-ci.yml covers the CLI;
# nothing ran these, so a regression in the loop, the lock guard, the review
# script, archiving or compose could land unseen
# (specforge/changes/archive/2026-10-23-compose).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # trusted_publishing_test reads a base commit with git show

      - name: Python suites
        run: |
          for suite in prd_check_test loop_test review_test review_fp_test archive_test archive_fix_test guard_git_test compose_test compose_fix_test reapprove_test reapprove_fix_test reapprove_fix2_test reapprove_fix3_test evidence_ci_test evidence_ci_fix_test evidence_ci_fix2_test evidence_ci_fix3_test symlinked_lock_test symlinked_lock_fix_test premise_challenge_test premise_challenge_fix_test premise_challenge_fix2_test loop_budget_test loop_budget_fix_test loop_budget_fix2_test loop_budget_fix3_test invisible_chars_test loop_budget_fix4_test loop_budget_fix5_test v2_adjustments_test migration_guide_test migration_guide_fix_test release_0_28_0_test trusted_publishing_test foreign_lock_test guard_sibling_test; do
            echo "::group::$suite"
            python3 scripts/$suite.py
            echo "::endgroup::"
          done
