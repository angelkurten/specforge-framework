name: cli-release

# Publishes @angelkurten/specforge to npm with provenance attestation.
# PRD-003 § 7.2 / § 8.1.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Bundle framework tree
        run: pnpm run prepublish

      - name: Test
        run: pnpm test

      # `npm publish` defaults to the `latest` dist-tag, which npm assigns by
      # publish order rather than by version. So publishing a tag that is not
      # the highest version -- a backfilled tag, a patch on an old line --
      # silently demotes `latest`, and every `npx @angelkurten/specforge` gets
      # the older tree. This happened: v0.18.0 was tagged retroactively after
      # v0.19.0 had shipped.
      #
      # `sort -V` orders plain x.y.z correctly. It does NOT order prereleases
      # per semver (1.0.0-rc.1 sorts after 1.0.0); this repo publishes none,
      # and a release line that starts using them needs a real semver compare
      # here.
      - name: Resolve dist-tag
        id: disttag
        run: |
          set -euo pipefail
          publishing=$(node -p "require('./package.json').version")
          current=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo "0.0.0")
          highest=$(printf '%s\n%s\n' "$current" "$publishing" | sort -V | tail -1)
          if [ "$highest" = "$publishing" ] && [ "$current" != "$publishing" ]; then
            tag=latest
          else
            tag=previous
          fi
          echo "Publishing $publishing; registry latest is $current; dist-tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
